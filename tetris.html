<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Tetris</title>
<style>
  :root {
    --cell-size: 28px;
    --color-bg: #1a1a2e;
    --color-panel: #16213e;
    --color-border: #0f3460;
    --color-text: #e0e0e0;
    --color-accent: #e94560;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    background-color: var(--color-bg);
    color: var(--color-text);
    font-family: "Segoe UI", Tahoma, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  .back-button {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 8px 14px;
    font-size: 14px;
    text-decoration: none;
    color: var(--color-text);
    background-color: var(--color-panel);
    border: 2px solid var(--color-border);
    border-radius: 4px;
    font-weight: bold;
    transition: background-color 0.2s;
  }
  .back-button:hover {
    background-color: var(--color-border);
  }

  h1 {
    margin: 20px 0 10px 0;
    font-size: 28px;
    letter-spacing: 4px;
  }

  .game-layout {
    display: flex;
    gap: 24px;
    align-items: flex-start;
  }

  .board-wrapper {
    position: relative;
    border: 3px solid var(--color-border);
    background-color: #000000;
  }

  canvas {
    display: block;
  }

  .side-panel {
    display: flex;
    flex-direction: column;
    gap: 16px;
    width: 180px;
  }

  .panel-box {
    background-color: var(--color-panel);
    border: 2px solid var(--color-border);
    border-radius: 6px;
    padding: 12px;
  }

  .panel-box h2 {
    margin: 0 0 8px 0;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 1px;
    color: #9aa5ce;
  }

  .panel-box .value {
    font-size: 22px;
    font-weight: bold;
  }

  .difficulty-select,
  .restart-button {
    width: 100%;
    padding: 8px;
    font-size: 15px;
    cursor: pointer;
    border-radius: 4px;
    border: 2px solid var(--color-border);
    background-color: #0f3460;
    color: var(--color-text);
  }

  .restart-button {
    background-color: var(--color-accent);
    border-color: var(--color-accent);
    font-weight: bold;
  }

  .restart-button:active {
    filter: brightness(0.9);
  }

  .next-piece-canvas {
    display: block;
    margin: 0 auto;
    background-color: #000000;
    border-radius: 4px;
  }

  .controls-list {
    font-size: 13px;
    color: #9aa5ce;
    line-height: 1.6;
    margin: 0;
    padding-left: 0;
    list-style: none;
  }

  .overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.75);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 10px;
  }

  .overlay.visible {
    display: flex;
  }

  .overlay .title {
    font-size: 26px;
    font-weight: bold;
    color: var(--color-accent);
  }

  .overlay .subtitle {
    font-size: 15px;
    color: #cccccc;
  }
</style>
</head>
<body>

<a href="index.html" class="back-button">&larr; Zurück</a>

<h1>TETRIS</h1>

<div class="game-layout">
  <div class="board-wrapper">
    <canvas id="boardCanvas"></canvas>
    <div class="overlay" id="overlay">
      <div class="title" id="overlayTitle">Pause</div>
      <div class="subtitle" id="overlaySubtitle">Leertaste zum Fortsetzen</div>
    </div>
  </div>

  <div class="side-panel">
    <div class="panel-box">
      <h2>Schwierigkeit</h2>
      <select class="difficulty-select" id="difficultySelect">
        <option value="easy">Leicht</option>
        <option value="medium" selected>Mittel</option>
        <option value="hard">Schwer</option>
      </select>
    </div>

    <div class="panel-box">
      <h2>Punkte</h2>
      <div class="value" id="scoreValue">0</div>
    </div>

    <div class="panel-box">
      <h2>Level</h2>
      <div class="value" id="levelValue">1</div>
    </div>

    <div class="panel-box">
      <h2>Linien</h2>
      <div class="value" id="linesValue">0</div>
    </div>

    <div class="panel-box">
      <h2>Nächster Stein</h2>
      <canvas class="next-piece-canvas" id="nextPieceCanvas" width="100" height="100"></canvas>
    </div>

    <button class="restart-button" id="restartButton">Neustart</button>

    <div class="panel-box">
      <h2>Steuerung</h2>
      <ul class="controls-list">
        <li>&#8592; &#8594; Bewegen</li>
        <li>&#8593; Drehen</li>
        <li>&#8595; Weicher Fall</li>
        <li>Leertaste: Harter Fall / Pause</li>
      </ul>
    </div>
  </div>
</div>

<script>
"use strict";

const BOARD_COLS = 10;
const BOARD_ROWS = 20;
const CELL_SIZE = 28;

const DIFFICULTY_PRESETS = Object.freeze({
  easy: { startingLevel: 1, framesPerRowAtLevel1: 55, linesPerLevel: 12 },
  medium: { startingLevel: 1, framesPerRowAtLevel1: 40, linesPerLevel: 10 },
  hard: { startingLevel: 3, framesPerRowAtLevel1: 25, linesPerLevel: 8 }
});

const DEFAULT_DIFFICULTY = "medium";

const POINTS_PER_LINES_CLEARED = Object.freeze({
  1: 100,
  2: 300,
  3: 500,
  4: 800
});

const TETROMINO_SHAPES = Object.freeze({
  I: { color: "#00f0f0", cells: [[0, 1], [1, 1], [2, 1], [3, 1]] },
  O: { color: "#f0f000", cells: [[1, 0], [2, 0], [1, 1], [2, 1]] },
  T: { color: "#a000f0", cells: [[1, 0], [0, 1], [1, 1], [2, 1]] },
  S: { color: "#00f000", cells: [[1, 0], [2, 0], [0, 1], [1, 1]] },
  Z: { color: "#f00000", cells: [[0, 0], [1, 0], [1, 1], [2, 1]] },
  J: { color: "#0000f0", cells: [[0, 0], [0, 1], [1, 1], [2, 1]] },
  L: { color: "#f0a000", cells: [[2, 0], [0, 1], [1, 1], [2, 1]] }
});

const TETROMINO_NAMES = Object.keys(TETROMINO_SHAPES);

class Tetromino {
  constructor(name) {
    this.name = name;
    this.color = TETROMINO_SHAPES[name].color;
    this.rotationStates = this.computeRotationStates(TETROMINO_SHAPES[name].cells);
    this.rotationIndex = 0;
    this.col = Math.floor(BOARD_COLS / 2) - 2;
    this.row = 0;
  }

  computeRotationStates(baseCells) {
    const states = [baseCells];
    let currentCells = baseCells;

    for (let rotation = 0; rotation < 3; rotation++) {
      currentCells = currentCells.map(([x, y]) => [3 - y, x]);
      states.push(currentCells);
    }

    return states;
  }

  getCurrentCells() {
    return this.rotationStates[this.rotationIndex];
  }

  getOccupiedBoardPositions(rowOffset = 0, colOffset = 0, rotationIndex = this.rotationIndex) {
    return this.rotationStates[rotationIndex].map(([x, y]) => ({
      row: this.row + y + rowOffset,
      col: this.col + x + colOffset
    }));
  }

  getNextRotationIndex() {
    return (this.rotationIndex + 1) % this.rotationStates.length;
  }
}

class Board {
  constructor(rows, cols) {
    this.rows = rows;
    this.cols = cols;
    this.grid = this.createEmptyGrid();
  }

  createEmptyGrid() {
    return Array.from({ length: this.rows }, () => new Array(this.cols).fill(null));
  }

  isInsideBounds(row, col) {
    return row >= 0 && row < this.rows && col >= 0 && col < this.cols;
  }

  isCellFree(row, col) {
    if (!this.isInsideBounds(row, col)) {
      return false;
    }
    if (row < 0) {
      return true;
    }
    return this.grid[row][col] === null;
  }

  canPlacePositions(positions) {
    return positions.every(({ row, col }) => {
      if (row < 0) {
        return col >= 0 && col < this.cols;
      }
      return this.isCellFree(row, col);
    });
  }

  lockPositions(positions, color) {
    for (const { row, col } of positions) {
      if (row >= 0) {
        this.grid[row][col] = color;
      }
    }
  }

  clearFullRows() {
    const remainingRows = this.grid.filter(row => row.some(cell => cell === null));
    const clearedCount = this.rows - remainingRows.length;

    const newEmptyRows = Array.from({ length: clearedCount }, () => new Array(this.cols).fill(null));
    this.grid = [...newEmptyRows, ...remainingRows];

    return clearedCount;
  }

  hasAnyBlockInTopRows(visibleRowCount) {
    for (let row = 0; row < visibleRowCount; row++) {
      if (this.grid[row].some(cell => cell !== null)) {
        return true;
      }
    }
    return false;
  }
}

class TetrisGame {
  constructor(difficultyPreset) {
    this.difficultyPreset = difficultyPreset;
    this.board = new Board(BOARD_ROWS, BOARD_COLS);
    this.bag = [];
    this.currentPiece = this.spawnPiece();
    this.nextPieceName = this.takeNextPieceNameFromBag();
    this.score = 0;
    this.linesCleared = 0;
    this.level = difficultyPreset.startingLevel;
    this.isGameOver = false;
    this.isPaused = false;
    this.framesUntilNextDrop = this.getFramesPerDrop();
  }

  refillBagIfEmpty() {
    if (this.bag.length === 0) {
      this.bag = this.shuffleArray([...TETROMINO_NAMES]);
    }
  }

  shuffleArray(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  takeNextPieceNameFromBag() {
    this.refillBagIfEmpty();
    return this.bag.pop();
  }

  spawnPiece() {
    const name = this.nextPieceName || this.takeNextPieceNameFromBag();
    return new Tetromino(name);
  }

  getFramesPerDrop() {
    const speedup = Math.pow(0.85, this.level - 1);
    return Math.max(3, Math.round(this.difficultyPreset.framesPerRowAtLevel1 * speedup));
  }

  tryMove(rowOffset, colOffset) {
    const newPositions = this.currentPiece.getOccupiedBoardPositions(rowOffset, colOffset);
    if (this.board.canPlacePositions(newPositions)) {
      this.currentPiece.row += rowOffset;
      this.currentPiece.col += colOffset;
      return true;
    }
    return false;
  }

  tryRotate() {
    const nextRotationIndex = this.currentPiece.getNextRotationIndex();
    const kicks = [0, -1, 1, -2, 2];

    for (const colKick of kicks) {
      const positions = this.currentPiece.getOccupiedBoardPositions(0, colKick, nextRotationIndex);
      if (this.board.canPlacePositions(positions)) {
        this.currentPiece.rotationIndex = nextRotationIndex;
        this.currentPiece.col += colKick;
        return true;
      }
    }
    return false;
  }

  hardDrop() {
    let cellsDropped = 0;
    while (this.tryMove(1, 0)) {
      cellsDropped++;
    }
    this.score += cellsDropped * 2;
    this.lockCurrentPiece();
  }

  softDropOneRow() {
    const moved = this.tryMove(1, 0);
    if (moved) {
      this.score += 1;
    } else {
      this.lockCurrentPiece();
    }
  }

  lockCurrentPiece() {
    const positions = this.currentPiece.getOccupiedBoardPositions();
    this.board.lockPositions(positions, this.currentPiece.color);

    if (this.board.hasAnyBlockInTopRows(2)) {
      this.isGameOver = true;
      return;
    }

    const clearedRows = this.board.clearFullRows();
    if (clearedRows > 0) {
      this.applyScoreForClearedRows(clearedRows);
    }

    this.currentPiece = this.spawnPiece();
    this.nextPieceName = this.takeNextPieceNameFromBag();
    this.framesUntilNextDrop = this.getFramesPerDrop();

    const spawnPositions = this.currentPiece.getOccupiedBoardPositions();
    if (!this.board.canPlacePositions(spawnPositions)) {
      this.isGameOver = true;
    }
  }

  applyScoreForClearedRows(clearedRows) {
    this.score += POINTS_PER_LINES_CLEARED[clearedRows] * this.level;
    this.linesCleared += clearedRows;

    const newLevel = this.difficultyPreset.startingLevel +
      Math.floor(this.linesCleared / this.difficultyPreset.linesPerLevel);

    if (newLevel !== this.level) {
      this.level = newLevel;
    }
  }

  togglePause() {
    if (!this.isGameOver) {
      this.isPaused = !this.isPaused;
    }
  }

  advanceOneFrame() {
    if (this.isGameOver || this.isPaused) {
      return;
    }

    this.framesUntilNextDrop--;
    if (this.framesUntilNextDrop <= 0) {
      this.softDropOneRow();
      this.framesUntilNextDrop = this.getFramesPerDrop();
    }
  }

  getGhostPieceRow() {
    let ghostRow = this.currentPiece.row;
    while (true) {
      const testPositions = this.currentPiece.getOccupiedBoardPositions(ghostRow - this.currentPiece.row + 1, 0);
      if (!this.board.canPlacePositions(testPositions)) {
        break;
      }
      ghostRow++;
    }
    return ghostRow;
  }
}

class TetrisRenderer {
  constructor(boardCanvas, nextPieceCanvas) {
    this.boardCanvas = boardCanvas;
    this.boardContext = boardCanvas.getContext("2d");
    this.nextPieceCanvas = nextPieceCanvas;
    this.nextPieceContext = nextPieceCanvas.getContext("2d");

    this.boardCanvas.width = BOARD_COLS * CELL_SIZE;
    this.boardCanvas.height = BOARD_ROWS * CELL_SIZE;
  }

  render(game) {
    this.clearCanvas(this.boardContext, this.boardCanvas);
    this.drawLockedBlocks(game.board);
    this.drawGhostPiece(game);
    this.drawActivePiece(game.currentPiece);
    this.drawNextPiecePreview(game.nextPieceName);
  }

  clearCanvas(context, canvas) {
    context.fillStyle = "#000000";
    context.fillRect(0, 0, canvas.width, canvas.height);
  }

  drawCell(context, row, col, color) {
    const x = col * CELL_SIZE;
    const y = row * CELL_SIZE;

    context.fillStyle = color;
    context.fillRect(x, y, CELL_SIZE, CELL_SIZE);

    context.strokeStyle = "rgba(0, 0, 0, 0.4)";
    context.lineWidth = 2;
    context.strokeRect(x, y, CELL_SIZE, CELL_SIZE);

    context.fillStyle = "rgba(255, 255, 255, 0.25)";
    context.fillRect(x, y, CELL_SIZE, 4);
  }

  drawLockedBlocks(board) {
    for (let row = 0; row < board.rows; row++) {
      for (let col = 0; col < board.cols; col++) {
        const color = board.grid[row][col];
        if (color !== null) {
          this.drawCell(this.boardContext, row, col, color);
        }
      }
    }
  }

  drawActivePiece(piece) {
    const positions = piece.getOccupiedBoardPositions();
    for (const { row, col } of positions) {
      if (row >= 0) {
        this.drawCell(this.boardContext, row, col, piece.color);
      }
    }
  }

  drawGhostPiece(game) {
    const ghostRow = game.getGhostPieceRow();
    const rowOffset = ghostRow - game.currentPiece.row;
    const positions = game.currentPiece.getOccupiedBoardPositions(rowOffset, 0);

    this.boardContext.strokeStyle = "rgba(255, 255, 255, 0.4)";
    this.boardContext.lineWidth = 2;

    for (const { row, col } of positions) {
      if (row >= 0) {
        this.boardContext.strokeRect(col * CELL_SIZE + 1, row * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
      }
    }
  }

  drawNextPiecePreview(pieceName) {
    this.clearCanvas(this.nextPieceContext, this.nextPieceCanvas);
    if (!pieceName) {
      return;
    }

    const shape = TETROMINO_SHAPES[pieceName];
    const previewCellSize = 20;
    const offsetX = (this.nextPieceCanvas.width - 4 * previewCellSize) / 2;
    const offsetY = (this.nextPieceCanvas.height - 4 * previewCellSize) / 2;

    for (const [x, y] of shape.cells) {
      this.nextPieceContext.fillStyle = shape.color;
      this.nextPieceContext.fillRect(
        offsetX + x * previewCellSize,
        offsetY + y * previewCellSize,
        previewCellSize,
        previewCellSize
      );
      this.nextPieceContext.strokeStyle = "rgba(0, 0, 0, 0.4)";
      this.nextPieceContext.strokeRect(
        offsetX + x * previewCellSize,
        offsetY + y * previewCellSize,
        previewCellSize,
        previewCellSize
      );
    }
  }
}

class InputHandler {
  constructor(onAction) {
    this.onAction = onAction;
    document.addEventListener("keydown", (event) => this.handleKeyDown(event));
  }

  handleKeyDown(event) {
    const keyActionMap = {
      ArrowLeft: "moveLeft",
      ArrowRight: "moveRight",
      ArrowDown: "softDrop",
      ArrowUp: "rotate",
      Space: "hardDropOrPause"
    };

    const action = keyActionMap[event.code];
    if (action) {
      event.preventDefault();
      this.onAction(action);
    }
  }
}

class TetrisApplication {
  constructor() {
    this.boardCanvas = document.getElementById("boardCanvas");
    this.nextPieceCanvas = document.getElementById("nextPieceCanvas");
    this.scoreValueElement = document.getElementById("scoreValue");
    this.levelValueElement = document.getElementById("levelValue");
    this.linesValueElement = document.getElementById("linesValue");
    this.difficultySelectElement = document.getElementById("difficultySelect");
    this.restartButtonElement = document.getElementById("restartButton");
    this.overlayElement = document.getElementById("overlay");
    this.overlayTitleElement = document.getElementById("overlayTitle");
    this.overlaySubtitleElement = document.getElementById("overlaySubtitle");

    this.renderer = new TetrisRenderer(this.boardCanvas, this.nextPieceCanvas);
    this.inputHandler = new InputHandler((action) => this.handleAction(action));

    this.difficultySelectElement.value = DEFAULT_DIFFICULTY;
    this.difficultySelectElement.addEventListener("change", () => this.startNewGame());
    this.restartButtonElement.addEventListener("click", () => this.startNewGame());

    this.startNewGame();
    this.startGameLoop();
  }

  getSelectedDifficultyPreset() {
    return DIFFICULTY_PRESETS[this.difficultySelectElement.value];
  }

  startNewGame() {
    this.game = new TetrisGame(this.getSelectedDifficultyPreset());
    this.updateSidePanel();
    this.updateOverlay();
  }

  handleAction(action) {
    if (action === "hardDropOrPause") {
      if (this.game.isGameOver) {
        return;
      }
      if (this.game.isPaused) {
        this.game.togglePause();
      } else {
        this.game.hardDrop();
      }
      this.updateSidePanel();
      this.updateOverlay();
      return;
    }

    if (this.game.isGameOver || this.game.isPaused) {
      return;
    }

    if (action === "moveLeft") {
      this.game.tryMove(0, -1);
    } else if (action === "moveRight") {
      this.game.tryMove(0, 1);
    } else if (action === "softDrop") {
      this.game.softDropOneRow();
    } else if (action === "rotate") {
      this.game.tryRotate();
    }

    this.updateSidePanel();
  }

  startGameLoop() {
    const frameIntervalMs = 1000 / 60;
    setInterval(() => {
      this.game.advanceOneFrame();
      this.updateSidePanel();
      this.updateOverlay();
      this.renderer.render(this.game);
    }, frameIntervalMs);
  }

  updateSidePanel() {
    this.scoreValueElement.textContent = this.game.score;
    this.levelValueElement.textContent = this.game.level;
    this.linesValueElement.textContent = this.game.linesCleared;
  }

  updateOverlay() {
    if (this.game.isGameOver) {
      this.overlayTitleElement.textContent = "Game Over";
      this.overlaySubtitleElement.textContent = `Punkte: ${this.game.score} — Neustart-Knopf klicken`;
      this.overlayElement.classList.add("visible");
    } else if (this.game.isPaused) {
      this.overlayTitleElement.textContent = "Pause";
      this.overlaySubtitleElement.textContent = "Leertaste zum Fortsetzen";
      this.overlayElement.classList.add("visible");
    } else {
      this.overlayElement.classList.remove("visible");
    }
  }
}

function main() {
  new TetrisApplication();
}

main();
</script>

</body>
</html>
